<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulaire de contact pour Majora's Lost Archives. Envoyez-nous vos questions ou commentaires concernant Zelda Majora's Mask.">
    <title>Formulaire de Contact</title>
    <link rel="stylesheet" href="../css/styleFormulaire.css">
</head>

<body>
    <header id="main-header">
        <a href="../index.html" aria-label="Retour à l'accueil"><img class="home-logo" src="/ressources/images/majora-icon.png" alt="Logo Majora"></a>
        <nav id="nav-buttons">
            <button id="darkModeBtn" class="buttons-toggle">Dark</button>
            <button id="navMenuBtn" class="buttons-toggle">Nav</button>
        </nav>
    </header>

    <section id="nav-sous-menu" class="sous-menu">
        <div><h2>Navigation</h2></div>
        <div>
            <ul>
                <li><a href="../index.html">Acceuil</a></li>
                <li><a href="contact.html">Formulaire</a></li>
                <li><a href="archive.html">Archives</a></li>
                <li><a href="zones.html">Zones</a></li>
            </ul>
        </div>
    </section>

    <main>
        <section class="form-container">
            <h1 id="title-name">Contactez-Nous</h1>
            <form action="mailto:hugobanti1007@gmail.com" method="post" enctype="text/plain">
                <div class="form-group">
                    <label for="nom">Nom:</label>
                    <input type="text" id="nom" name="nom" required>
                </div>

                <div class="form-group">
                    <label for="prenom">Prénom:</label>
                    <input type="text" id="prenom" name="prenom" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <fieldset>
                        <legend>Sexe:</legend>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="homme" name="sexe" value="homme">
                                <label for="homme">Homme</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="femme" name="sexe" value="femme">
                                <label for="femme">Femme</label>
                            </div>
                        </div>
                    </fieldset>
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required></textarea>
                </div>

                <button type="submit">Envoyer</button>
            </form>
        </section>
    </main>

    <a id="topButtonLink" class="top-link" title="Revenir en haut de page">
        <span class="arrow-circle-up"></span>
    </a>
    <footer>
        <section id="github-links">
            <h3>Nos Github : </h3>
            <ul>
                <li><a href="https://github.com/SISbouba" target="_blank" rel="noopener noreferrer" title="Lien vers le repo GitHub">Aboubakar-Sise</a></li>
                <li><a href="https://github.com/hugo-banti" target="_blank" rel="noopener noreferrer" title="Lien vers le repo GitHub">Hugo-Banti</a></li>
                <li><a href="https://github.com/Dartinxe" target="_blank" rel="noopener noreferrer" title="Lien vers le repo GitHub">Dartinxe</a></li>
            </ul>
        </section>
        <div id="amu-images">
            <img src="/ressources/images/amulogo.png" alt="Amu Images" class="footer-icon">
        </div>
    </footer>
    
    <script src="../javascript/script.js"></script>
</body>
</html>
