<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de Contact</title>
    <link rel="stylesheet" href="../css/styleFormulaire.css">
</head>

<body>
    <header id="main-header">
        <a href="accueil.html"><h1 class="home-logo">Acceuil</h1></a>
        <nav id="nav-buttons">
            <button onclick="toggleNavMenu('sous-menu-desktop')" class="buttons-toggle">Navigation</button>
            <button onclick="toggleDarkMode()" class="buttons-toggle">Dark Theme</button>
            <button onclick="toggleTranslatation()" class="buttons-toggle">English</button>
        </nav>
    </header>

    <section id="nav-sous-menu" class="sous-menu">
        <div><h1>Navigation</h1></div>
        <div>
            <ul>
                <li><a href="accueil.html">Acceuil</a></li>
                <li><a href="contact.html">Formulaire</a></li>
                <li><a href="archive.html">Archives</a></li>
                <li><a href="zones.html">Zones</a></li>
            </ul>
        </div>
    </section>
    <div class="overlay" id="overlay"></div>

    <div class="form-container">
        <form>
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom">
            </div>

            <div class="form-group">
                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" name="prenom">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label>Sexe</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="homme" name="sexe" value="homme">
                        <label for="homme">Homme</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="femme" name="sexe" value="femme">
                        <label for="femme">Femme</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message"></textarea>
            </div>

            <button type="submit">Envoyer</button>
        </form>
    </div>

    <a onclick="scrollToTop()" class="top-link" id="topButton" title="Revenir en haut de page">
        <span class="arrow-circle-up"></span>
    </a>
    <footer>
        <section id="github-links">
            <h3>Nos Github : </h3>
            <li><a href="https://github.com/SISbouba" target="_blank" title="Lien vers le repo GitHub">Aboubakar-Sise</a></li>
            <li><a href="https://github.com/hugo-banti" target="_blank" title="Lien vers le repo GitHub">Hugo-Banti</a></li>
            <li><a href="https://github.com/Dartinxe" target="_blank" title="Lien vers le repo GitHub">Dartinxe</a></li>
        </section>
        <section id="amu-images">
            <img src="/images/amulogo.png" alt="Amu Images" class="footer-icon">
        </section>
    </footer>
    
    <script src="../javascript/script.js"></script>
</body>
</html>
